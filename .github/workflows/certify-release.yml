name: Certify release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      baseline_sha:
        description: Exact current stable SHA
        required: true
        type: string
      review_sha256:
        description: SHA256 of the reviewed candidate Pstack evidence report
        required: true
        type: string
      approve_reviewed_evidence:
        description: Approve this exact report and its stated compatibility limits
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tugling-release-certification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CONTROLLER_SHA: ${{ vars.TUGLING_CERTIFICATION_CONTROLLER_SHA }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  CERTIFICATION_ENABLED: ${{ vars.TUGLING_CERTIFICATION_ENABLED }}
  APPROVE_REVIEWED_EVIDENCE: ${{ inputs.approve_reviewed_evidence }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  BASELINE_SHA: ${{ inputs.baseline_sha }}
  REVIEW_SHA256: ${{ inputs.review_sha256 }}

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - name: Install the pinned CLI without account or model setup
        run: npm install --prefix "$RUNNER_TEMP/tugling-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.153.4
      - name: Certify the approved review and fresh exact-commit public installation
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_POLICY_PATTERNS: ${{ secrets.TUGLING_PUBLIC_POLICY_PATTERNS }}
        run: |
          umask 077
          printf '%s\n' "$PUBLIC_POLICY_PATTERNS" > "$RUNNER_TEMP/public-policy-patterns"
          unset PUBLIC_POLICY_PATTERNS
          python3 -I scripts/pstack_release.py run \
            --out "$RUNNER_TEMP/certification" \
            --policy-pattern-file "$RUNNER_TEMP/public-policy-patterns" \
            --codex-bin "$RUNNER_TEMP/tugling-codex/node_modules/.bin/codex"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certification-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/certification/*.json
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: certification-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/certification
      - name: Check the exact approved report and candidate before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/pstack_release.py validate-artifact --out "$RUNNER_TEMP/certification"
      - name: Attest the certificate and its exact-commit envelope
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/certification/certificate.json
            ${{ runner.temp }}/certification/certification.json
