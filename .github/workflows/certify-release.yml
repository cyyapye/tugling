name: Certify release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      baseline_sha:
        description: Exact current stable SHA
        required: true
        type: string
      approved_input_tokens:
        description: Total observed input-token threshold, split equally between two serial lanes (includes cached input)
        required: true
        type: string
      approved_output_tokens:
        description: Total observed output-token threshold, split equally between two serial lanes
        required: true
        type: string
      approve_paid_run:
        description: Approve API charges; up to two in-flight tasks can exceed lane thresholds (not a hard dollar cap)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tugling-release-certification
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CONTROLLER_SHA: ${{ vars.TUGLING_CERTIFICATION_CONTROLLER_SHA }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  CERTIFICATION_ENABLED: ${{ vars.TUGLING_CERTIFICATION_ENABLED }}
  APPROVE_PAID_RUN: ${{ inputs.approve_paid_run }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  BASELINE_SHA: ${{ inputs.baseline_sha }}
  APPROVED_INPUT_TOKENS: ${{ inputs.approved_input_tokens }}
  APPROVED_OUTPUT_TOKENS: ${{ inputs.approved_output_tokens }}
  MAX_INPUT_TOKENS: ${{ vars.TUGLING_CERTIFICATION_MAX_INPUT_TOKENS }}
  MAX_OUTPUT_TOKENS: ${{ vars.TUGLING_CERTIFICATION_MAX_OUTPUT_TOKENS }}

jobs:
  certify:
    uses: ./.github/workflows/certification-pipeline.yml
    permissions:
      contents: read
      actions: read
    with:
      synthetic: false
    secrets:
      api-key: ${{ secrets.TUGLING_CERTIFICATION_API_KEY }}
      policy: ${{ secrets.TUGLING_PUBLIC_POLICY_PATTERNS }}

  attest:
    needs: certify
    if: needs.certify.outputs.state == 'CERTIFICATION_REQUIRED'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: certification-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/certification
      - name: Check certificate identity before signing any data
        run: python3 -I scripts/certify_release.py validate-artifact --out "$RUNNER_TEMP/certification"
      - name: Attest the certificate and its exact-commit envelope
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/certification/certificate.json
            ${{ runner.temp }}/certification/certification.json
      # No contents:write permission, promotion, commits, or PR comments here.
