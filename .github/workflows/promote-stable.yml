name: Promote stable

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main SHA to promote
        required: true
        type: string
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      certificate_sha256:
        description: SHA256 of the manually reviewed certificate at candidate_sha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tugling-stable-promotion
  cancel-in-progress: false

jobs:
  authorize-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the separately approved workflow revision
        env:
          CONTROLLER_SHA: ${{ vars.TUGLING_RELEASE_CONTROLLER_SHA }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
        shell: bash
        run: |
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$CONTROLLER_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$CERTIFICATE_SHA256" =~ ^[0-9a-f]{64}$ ]]

  verify-candidate:
    needs: authorize-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run candidate code with read-only repository permission
        run: make verify

  promote:
    needs: verify-candidate
    if: vars.TUGLING_RELEASE_CONTROLLER_SHA != '' && github.workflow_sha == vars.TUGLING_RELEASE_CONTROLLER_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out only the approved controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify candidate data and atomically promote refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          CERTIFICATE_SHA256: ${{ inputs.certificate_sha256 }}
        run: >-
          python3 -I scripts/release_controller.py
          --controller-sha "$CONTROLLER_SHA"
          --candidate-sha "$CANDIDATE_SHA"
          --version "$RELEASE_VERSION"
          --certificate-sha256 "$CERTIFICATE_SHA256"
          --apply
