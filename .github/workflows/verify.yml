name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prove worker containment with deliberate resource failures
        run: python3 scripts/check_worker_isolation.py --work "$RUNNER_TEMP/isolation-worker" --out "$RUNNER_TEMP/isolation-proof"
      - name: Upload numeric isolation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-isolation-proof
          path: ${{ runner.temp }}/isolation-proof/*.json
          if-no-files-found: error
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: make verify

  codex-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the pinned CLI without account credentials
        run: npm install --prefix "$RUNNER_TEMP/tugling-codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.153.4
      - name: Exercise the real CLI against a local fake API
        run: python3 -I scripts/check_codex_ci.py --codex-bin "$RUNNER_TEMP/tugling-codex/node_modules/.bin/codex"

  certification-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PUBLIC_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Marketplace installation requires the contributor's public commit.
          repository: ${{ env.PUBLIC_REPOSITORY }}
          ref: ${{ env.PUBLIC_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Start the local synthetic provider
        id: fake
        shell: bash
        run: |
          python3 -I scripts/check_certification_ci.py serve --state "$RUNNER_TEMP/tugling-fake-api.json" > "$RUNNER_TEMP/tugling-fake-api.log" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          python3 -I scripts/check_certification_ci.py ready --state "$RUNNER_TEMP/tugling-fake-api.json" >> "$GITHUB_OUTPUT"
      # Match the release setup while routing every model request to loopback.
      # All contributors may run this job: it has no account credentials.
      - name: Set up the pinned CLI and proxy with a synthetic credential
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: tugling-synthetic-credential-not-a-secret
          responses-api-endpoint: ${{ steps.fake.outputs.endpoint }}
          codex-version: "0.153.4"
          codex-home: ${{ runner.temp }}/tugling-fake-ci-home
          safety-strategy: drop-sudo
          allow-users: "*"
      - name: Exercise the public installation task without a real model
        run: >-
          python3 -I scripts/check_certification_ci.py check
          --state "$RUNNER_TEMP/tugling-fake-api.json"
          --proxy-info "$RUNNER_TEMP/tugling-fake-ci-home/$GITHUB_RUN_ID.json"
          --source "$PUBLIC_REPOSITORY" --ref "$PUBLIC_REVISION"
      - name: Stop the synthetic provider
        if: always()
        env:
          FAKE_PID: ${{ steps.fake.outputs.pid }}
        run: |
          if [[ "$FAKE_PID" =~ ^[1-9][0-9]*$ ]]; then
            kill "$FAKE_PID" 2>/dev/null || true
          fi
